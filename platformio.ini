; Whisli Sense – presence sensor on Waveshare ESP32-C3-Zero.
; PlatformIO has no C3-Zero board; esp32-c3-devkitm-1 has the same chip (ESP32-C3FH4, 4 MB flash).

[platformio]
default_envs = whisli-sense

[env:whisli-sense]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; Two 1.9 MB app slots for OTA.
board_build.partitions = min_spiffs.csv
build_flags =
    -std=gnu++17
    ; The C3-Zero only has native USB, so Serial goes over USB CDC.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1
    bblanchon/ArduinoJson@7.4.2
; Builds the panel (ui/) and the version header before compiling.
extra_scripts = pre:scripts/prebuild.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Over Wi-Fi: pio run -e ota -t upload --upload-port whisli-salon.local
; The panel password comes from the WHISLI_SENSE_PASSWORD environment variable.
[env:ota]
extends = env:whisli-sense
upload_protocol = custom
upload_command = curl --fail-with-body -sS -u whisli:${sysenv.WHISLI_SENSE_PASSWORD} -H "Content-Type: application/octet-stream" --data-binary @$SOURCE http://$UPLOAD_PORT/api/v1/firmware
